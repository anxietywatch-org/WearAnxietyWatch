name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: wear-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.filter.outputs.node }}
      wear: ${{ steps.filter.outputs.wear }}
      mobile: ${{ steps.filter.outputs.mobile }}
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            node:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - 'apps/web/**'
              - 'services/api/**'
              - 'packages/contracts/**'
            wear:
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'apps/wear/**'
            mobile:
              - 'package.json'
              - 'package-lock.json'
              - 'apps/mobile/**'
              - 'packages/contracts/**'
            ml:
              - 'services/ml/**'

  node:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run lint

  wear:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.wear == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew :apps:wear:assembleDebug

  mobile-android:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run test --workspace @anxietywatch/mobile -- --runInBand
      - run: chmod +x apps/mobile/android/gradlew
      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore apps/mobile/android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - run: ./apps/mobile/android/gradlew -p apps/mobile/android assembleDebug

  ml:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ml/pyproject.toml
      - run: python -m pip install -e "./services/ml[dev]"
      - run: python -m pytest services/ml
