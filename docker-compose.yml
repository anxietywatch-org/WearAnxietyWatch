services:
  postgres:
    image: postgres:17-alpine
    container_name: anxietywatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anxietywatch}
      POSTGRES_USER: ${POSTGRES_USER:-anxietywatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anxietywatch-local-only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - anxietywatch_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-anxietywatch} -d ${POSTGRES_DB:-anxietywatch}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anxietywatch_postgres_data:
